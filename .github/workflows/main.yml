---
name: CI

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches:
      - v1
    tags:
      - v*
  pull_request:
    branches:
      - v1
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - 3.11
          - 3.12
          - 3.13
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Lint with flake8
        run: uv run flake8
      - name: Run tests
        run: |
          export PATH="$PATH:$PWD/exodus_core/dexdump/"
          uv run python -m unittest discover -v -s exodus_core -p "test_*.py"
          uv build
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.python-version }}
          path: dist
  release:
    name: Create Github release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download archive
        uses: actions/download-artifact@v4
        with:
          name: release-3.11
          path: dist
      - name: Publish package to pypi on tag
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Create release
        run: |
          cd dist
          echo "ARCHIVE=$(ls *.tar.gz)" >> $GITHUB_ENV
          gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --generate-notes
      - name: Upload archive on release
        run: gh release upload ${{ github.ref_name }} dist/$ARCHIVE
